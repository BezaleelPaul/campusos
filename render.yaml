# Render blueprint: free API service + free Postgres, wired via DATABASE_URL.
databases:
  - name: campusos-db
    plan: free

services:
  - type: web
    name: campusos-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_OPTS
        value: -Xmx256m
      - key: DATABASE_URL
        fromDatabase:
          name: campusos-db
          property: connectionString
